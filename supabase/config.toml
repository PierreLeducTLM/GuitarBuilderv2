# Local Supabase stack for development and CI (`supabase start`, `supabase db start`,
# `supabase test db`). Reference: https://supabase.com/docs/guides/local-development/cli/config
# Production uses the same Auth settings, configured in the Supabase dashboard
# (see README.md, "Authentication settings").
project_id = "guitar-builder"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[edge_runtime]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
# Site address used in verification-email links (user-auth: Authentication Configuration).
site_url = "http://127.0.0.1:3000"
# Where verification links may return to after confirming an email.
additional_redirect_urls = [
  "http://127.0.0.1:3000/auth/confirm",
  "http://localhost:3000/auth/confirm",
]
# Access credentials last about one hour; renewal tokens rotate on use (user-auth:
# Session Persistence and Restore).
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Operator switch: whether new sign-ups are allowed.
enable_signup = true
enable_anonymous_sign_ins = false
# user-auth: Password Length Validation.
minimum_password_length = 6

[auth.email]
enable_signup = true
double_confirm_changes = true
# Operator switch: require email verification before the first sign-in. Off locally
# so sign-up signs in immediately; production decides (see README.md).
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"

[auth.email.template.confirmation]
subject = "Confirm your Guitar Builder account / Confirmez votre compte Guitar Builder"
content_path = "./supabase/templates/confirmation.html"
