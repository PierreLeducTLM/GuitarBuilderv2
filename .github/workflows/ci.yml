name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Check, build and end-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # The production build only needs the public variables to exist; it makes no
      # request to Supabase. The e2e tests build their own copy against a fake server.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
    steps:
      - uses: actions/checkout@v5

      # Uses the pnpm version pinned in package.json ("packageManager").
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint and unit tests
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter @gb/web exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  database:
    name: Database policy tests (pgTAP)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Start the local database with the migrations applied
        run: supabase db start

      - name: Run the pgTAP tests
        run: supabase test db

      - name: First-admin race test (two concurrent sign-ups)
        run: bash scripts/test-db/first-admin-race.sh "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
