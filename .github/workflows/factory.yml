name: Factory
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  pull-requests: write
env:
  LINEAR_API_KEY: ${{ secrets.FACTORY_LINEAR_API_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  record-merge:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the factory
        run: npm install --prefix "$HOME/.factory" "git+https://x-access-token:${FACTORY_REPO_TOKEN}@github.com/PierreLeducTLM/software-factory.git#v0.1.0" && echo "$HOME/.factory/node_modules/.bin" >> "$GITHUB_PATH"
        env:
          FACTORY_REPO_TOKEN: ${{ secrets.FACTORY_REPO_TOKEN }}
      - run: factory record-merge --commit ${{ github.sha }}
  revert:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the factory
        run: npm install --prefix "$HOME/.factory" "git+https://x-access-token:${FACTORY_REPO_TOKEN}@github.com/PierreLeducTLM/software-factory.git#v0.1.0" && echo "$HOME/.factory/node_modules/.bin" >> "$GITHUB_PATH"
        env:
          FACTORY_REPO_TOKEN: ${{ secrets.FACTORY_REPO_TOKEN }}
      - run: factory revert --commit ${{ github.event.workflow_run.head_sha }}
