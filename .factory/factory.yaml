schema: 1
engine: 0.1.0
main_branch: main
states:
  to_refine: Backlog
  spec_review: Spec Review
  ready_for_dev: Todo
  in_development: In Progress
  in_review: In Review
  blocked: Blocked
  done: Done
labels:
  auto: factory-auto
  no_automerge: factory:no-automerge
checks:
  - id: test
    station: quality
    kind: script
    source: local
    blocking: true
    timeout: 30s
    run: pnpm run test
  - id: database-policy-tests-pgtap
    station: quality
    kind: script
    source: ci
    blocking: true
    timeout: 15m
    job: Database policy tests (pgTAP)
  - id: lint
    station: quality
    kind: script
    source: local
    blocking: true
    timeout: 30s
    run: pnpm run lint
  - id: typecheck
    station: quality
    kind: script
    source: local
    blocking: true
    timeout: 30s
    run: pnpm run typecheck
  - id: build
    station: quality
    kind: script
    source: local
    blocking: false
    timeout: 2m
    run: NEXT_TELEMETRY_DISABLED=1 NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=ci-placeholder-publishable-key pnpm
      run build
  - id: check-build-and-end-to-end-tests
    station: review
    kind: script
    source: ci
    blocking: false
    timeout: 15m
    job: Check, build and end-to-end tests
risk:
  low:
    merge: auto
  medium:
    merge: human
    reviewers: 1
  high:
    merge: human
    reviewers: 2
  sensitive_paths:
    - supabase/**
    - .github/**
    - apps/web/src/lib/auth/**
    - apps/web/src/lib/supabase/**
    - apps/web/src/app/auth/**
    - apps/web/src/lib/env.ts
  shadow: true
